services:
  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      mysql_db:
        condition: service_healthy
    environment:
      - MYSQL_HOST=mysql_db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=rootpass
      - MYSQL_DATABASE=usuarios_db
    volumes:
      - .:/app
    networks:
      - appnet

  mysql_db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: usuarios_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 90s # Aumentado para dar más tiempo a MySQL
    networks:
      - appnet

volumes:
  db_data:

networks:
  appnet:
    driver: bridge