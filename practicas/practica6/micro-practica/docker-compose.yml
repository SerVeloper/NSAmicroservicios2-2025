version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  producer:
    build: ./producer
    container_name: producer
    depends_on:
      - rabbitmq
    env_file:
      - ./producer/.env
    ports:
      - "3000:3000"

  consumer:
    build: ./consumer
    container_name: consumer
    depends_on:
      - rabbitmq
    env_file:
      - ./consumer/.env
